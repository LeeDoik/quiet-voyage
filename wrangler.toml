name = "quiet-voyage"
main = "server/worker.js"
compatibility_date = "2025-09-01"

# The game is plain static files in public/: requests for a file are served directly,
# everything else (/ws, /health) reaches the Worker.
[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "CELL"
class_name = "SeaCell"

# SQLite-backed Durable Objects work on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeaCell"]

# Staging: `npm run deploy:staging` deploys a separate Worker (quiet-voyage-staging) with its own
# Durable Objects, bottles and secrets, so test boats never share the sea with real players.
# Bindings are not inherited by environments, so they are declared again here.
[env.staging]

[[env.staging.durable_objects.bindings]]
name = "CELL"
class_name = "SeaCell"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["SeaCell"]
